name: Package

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Perform dry run without publishing"
        type: boolean
        default: true

concurrency:
  group: Package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  codeql:
    name: CodeQL Gate
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  publish:
    name: Build and Publish Packages
    runs-on: ubuntu-latest
    needs: [ ci, codeql ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build & Publish Packages
        uses: wgtechlabs/package-build-flow-action@v2.1.1
        with:
          monorepo: 'true'
          workspace-detection: 'true'
          package-manager: 'bun'
          dependency-order: 'true'
          changed-only: 'false'
          commit-convention-enabled: 'true'
          bot-detection: 'true'
          registry: 'both'
          access: 'public'
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ github.token }}
          publish-enabled: 'true'
          dry-run: ${{ github.event_name == 'pull_request' && 'true' || (github.event_name == 'workflow_dispatch' && inputs['dry-run'] && 'true' || 'false') }}
          build-script: 'build'
          audit-enabled: 'true'
          audit-level: 'high'
          fail-on-audit: 'false'
